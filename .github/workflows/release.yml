name: Release

on:
  push:
    tags: [v*]

jobs:
  pypi:
    runs-on: "${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}"
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read coordinated release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-metadata.py > "$RUNNER_TEMP/release-manifest.json"
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: marimo-team/internal-gh-actions/validate-release@3a52681ab8e200a34175ec8e5d14985e4e7ce3c3
        with:
          manifest: ${{ runner.temp }}/release-manifest.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py
      - run: uv publish
